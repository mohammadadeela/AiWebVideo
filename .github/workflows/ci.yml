name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        id: test
        continue-on-error: ${{ github.ref == 'refs/heads/redesign' }}
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-output.log

      - name: Upload failing test diagnostics
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.run_id }}
          path: test-output.log
          retention-days: 3

      - name: Production build
        run: pnpm build

      - name: Publish preview build (work branch only)
        if: github.ref == 'refs/heads/redesign'
        run: |
          cd artifacts/aiwebvideo/dist/public
          git init -q -b preview-build
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "preview build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-build
