<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Linkreel: turn any link into a video with AI</title>
    <meta
      name="description"
      content="Paste a website, product page or map link and Linkreel turns it into a finished AI video or image set. Free to try, no card needed."
    />
    <meta name="robots" content="index, follow" />
    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="application-name" content="Linkreel" />
    <meta name="apple-mobile-web-app-title" content="Linkreel" />
    <link rel="canonical" href="https://aiwebvideo.com/" />
    <meta property="og:title" content="Linkreel: turn any link into a video with AI" />
    <meta
      property="og:description"
      content="Paste a website, product page or map link and get a finished AI video or image set."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Linkreel" />
    <meta property="og:url" content="https://aiwebvideo.com/" />
    <meta property="og:image" content="https://aiwebvideo.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Linkreel: turn any link into a video with AI" />
    <meta
      name="twitter:description"
      content="Paste a website, product page or map link and get a finished AI video or image set."
    />
    <meta name="twitter:image" content="https://aiwebvideo.com/og-image.png" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try { if (localStorage.getItem("aiwebvideo_theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script id="site-structured-data" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://aiwebvideo.com/#website",
            "url": "https://aiwebvideo.com/",
            "name": "Linkreel",
            "alternateName": ["AiWebVideo", "AI Web Video", "aiwebvideo.com"],
            "publisher": { "@id": "https://aiwebvideo.com/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://aiwebvideo.com/#organization",
            "name": "Linkreel",
            "alternateName": "AiWebVideo",
            "url": "https://aiwebvideo.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://aiwebvideo.com/icon-512.png",
              "width": 512,
              "height": 512
            }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://aiwebvideo.com/#application",
            "name": "Linkreel",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Web",
            "url": "https://aiwebvideo.com/",
            "description": "Linkreel turns a website link, a product page, a map location or a few photos into finished AI videos and images.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD", "description": "Free starter credits, no card needed" },
            "publisher": { "@id": "https://aiwebvideo.com/#organization" }
          }
        ]
      }
    </script>

    <style id="seo-initial-style">
      html{background:#fff}
      html[data-theme=dark]{background:#0f1218}
      .seo-initial{min-height:100vh;background:#fff;color:#0d0d0d;font-family:Geist,system-ui,sans-serif;padding:72px 20px}
      .seo-initial__inner{max-width:920px;margin:0 auto}
      .seo-initial__eyebrow{font-size:14px;color:#74747e;margin:0 0 18px}
      .seo-initial h1{font-family:Geist,system-ui,sans-serif;font-size:clamp(2.4rem,7vw,4.75rem);line-height:1;letter-spacing:-.045em;margin:0 0 22px}
      .seo-initial__intro{max-width:760px;color:#55555e;font-size:17px;line-height:1.7;margin-bottom:44px}
      .seo-initial section,.seo-initial nav{border-top:1px solid rgba(13,13,13,.1);padding:26px 0}
      .seo-initial h2{font-size:22px;margin:0 0 10px}
      .seo-initial h3{font-size:15px;margin:18px 0 6px}
      .seo-initial p{color:#55555e;line-height:1.7}
      .seo-initial ul{display:flex;flex-wrap:wrap;gap:10px;padding:0;list-style:none}
      .seo-initial a{color:#2563eb;text-decoration:none}
      .seo-initial__cta a{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:999px;color:#fff;background:#0d0d0d;font-weight:600}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Linkreel (formerly AiWebVideo) turns website links, product pages, map locations and photos into AI videos and images. Enable JavaScript to create yours.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
